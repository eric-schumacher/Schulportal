<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vorgänger und Nachfolger mit Dienes-Material</title>
<style>
:root{--ink:#202428;--green:#2d9b62;--red:#d34f56;--line:#cbd8d2;--one:#f6ce45;--ten:#61cdb3;--hundred:#758fe5;--thousand:#ec7390}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Inter,"Arial Rounded MT Bold",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 10%,#fff 0,#f4f8f5 50%,#dce9e3 100%);-webkit-tap-highlight-color:transparent}
main{height:100svh;padding:clamp(7px,1.4vw,20px)}.app{width:min(1600px,100%);height:100%;margin:auto;display:grid;grid-template-rows:auto 1fr;overflow:hidden;border:1px solid rgba(65,94,81,.18);border-radius:clamp(18px,2.4vw,34px);background:rgba(255,255,255,.72);box-shadow:0 22px 60px rgba(47,79,64,.14)}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:3px solid var(--line);background:rgba(255,255,255,.72)}.head{min-width:0;padding:clamp(10px,1.8vh,22px) clamp(8px,1.6vw,22px);text-align:center;border-right:2px solid var(--line)}.head:last-child{border-right:0}.head h2{font-size:clamp(20px,2.25vw,34px);margin:0 0 clamp(8px,1.4vh,16px);letter-spacing:.01em}.head:nth-child(1) h2{color:var(--red)}.head:nth-child(2) h2{color:#111;font-weight:900;font-style:italic}.head:nth-child(3) h2{color:var(--green)}
.answer-row{height:clamp(48px,6.5vh,66px);display:flex;justify-content:center;align-items:center;gap:clamp(7px,1vw,14px)}input{width:min(72%,260px);height:100%;border:3px solid #94b9d7;border-radius:15px;background:#fff;text-align:center;font:900 clamp(22px,2.4vw,36px) Arial;color:var(--ink);outline:none;transition:.18s}input:focus{box-shadow:0 0 0 4px rgba(65,85,75,.12)}#prev,#prev.wrong,#prev.correct{border-color:var(--red);color:var(--red);background:#fff5f5}#next,#next.wrong,#next.correct{border-color:var(--green);color:var(--green);background:#f2fbf6}.given{width:min(72%,260px);border-color:#111;background:#fff;color:#111;font-size:clamp(24px,2.8vw,40px);font-weight:900;font-style:italic}
.help{--help-size:clamp(48px,6.5vh,66px);flex:0 0 var(--help-size);width:var(--help-size);min-width:var(--help-size);max-width:var(--help-size);height:var(--help-size);min-height:var(--help-size);max-height:var(--help-size);aspect-ratio:1/1;padding:0;border:2px solid #23825a;border-radius:50%;background:#91ddb8;color:#173b2c;font:900 clamp(10px,1.05vw,15px) Arial;cursor:pointer;box-shadow:0 3px 0 #5aa982;transition:.12s}.head:first-child .help{border-color:#b83e45;background:#ef9da1;color:#642328;box-shadow:0 3px 0 #c35f65}.head:nth-child(2) .help{border-color:#111;background:#e5e5e5;color:#111;box-shadow:0 3px 0 #999}.help:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,80,70,.35)}.help:disabled{opacity:.45;cursor:default;transform:none}.help[hidden]{display:none}

#fx{position:absolute;inset:0;z-index:5;width:100%;height:100%;pointer-events:none}.round{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:min(680px,92%);padding:clamp(18px,3vh,30px);border:2px solid rgba(45,91,70,.2);border-radius:26px;background:rgba(255,255,255,.98);box-shadow:0 20px 65px rgba(35,65,51,.25);text-align:center;opacity:0;pointer-events:none;transition:.35s}.round.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}.round h3{margin:0 0 7px;color:var(--green);font-size:clamp(23px,3vw,38px)}.round p{margin:0 0 10px;font-size:clamp(15px,1.6vw,20px)}.round button{border:0;border-radius:14px;padding:13px 25px;background:var(--green);color:#fff;font:900 17px Arial;cursor:pointer}.numberline{display:block;width:100%;height:clamp(105px,16vh,145px);margin:0 auto 8px}
.round button{background:#e5ad18;color:#302407;box-shadow:0 3px 0 #b68108}
@media(max-width:700px){main{padding:4px}.head{padding:8px 4px}.head h2{font-size:17px}.answer-row{gap:4px}input,.given{border-width:2px;border-radius:10px}.help{font-size:8px}.step{left:2%;right:2%;font-size:11px;padding:5px}.status{display:none}}
</style>
</head>
<body><main><section class="app">
  <div class="top">
    <header class="head"><h2>Vorgänger</h2><div class="answer-row"><input id="prev" inputmode="numeric" maxlength="4" aria-label="Vorgänger eingeben"><button class="help" data-side="prev">HILFE</button></div></header>
    <header class="head"><h2>Zahl</h2><div class="answer-row"><input class="given" id="given" inputmode="numeric" maxlength="4" aria-label="Zahl eingeben"><button class="help" data-side="mid" hidden>HILFE</button></div></header>
    <header class="head"><h2>Nachfolger</h2><div class="answer-row"><input id="next" inputmode="numeric" maxlength="4" aria-label="Nachfolger eingeben"><button class="help" data-side="next">HILFE</button></div></header>
  </div>
  <div class="work" id="work">
    <section class="cell"><canvas class="material" id="prevCanvas"></canvas><div class="step" id="prevStep"></div><div class="status" id="prevStatus"></div></section>
    <section class="cell"><canvas class="material" id="midCanvas"></canvas><div class="step" id="midStep"></div><div class="status" id="midStatus"></div></section>
    <section class="cell"><canvas class="material" id="nextCanvas"></canvas><div class="step" id="nextStep"></div><div class="status" id="nextStatus"></div></section>
    <canvas id="fx"></canvas>
    <div class="round" id="round"><h3>Sehr gut!</h3><canvas class="numberline" id="numberline"></canvas><button id="newTask" style="background:#e5ad18!important;color:#302407!important;box-shadow:0 3px 0 #b68108!important">Nächste Aufgabe</button></div>
  </div>
</section></main>
<script>
const COLORS=['#F6CE45','#61CDB3','#758FE5','#EC7390'];
const BLOCKS=[{nx:1,ny:1,nz:1,c:COLORS[0]},{nx:10,ny:1,nz:1,c:COLORS[1]},{nx:10,ny:1,nz:10,c:COLORS[2]},{nx:10,ny:10,nz:10,c:COLORS[3]}];
const TASKS=[102,243,678,1299,2046,3589,4725,6999,8104];let task=0,completed=0,givenRole=1,baseValue=TASKS[0],busy=false,solvedShown=false;
const $=s=>document.querySelector(s),prev=$('#prev'),next=$('#next'),given=$('#given'),work=$('#work'),fx=$('#fx');
const roles=['prev','mid','next'],fields=[prev,given,next],canvases={prev:$('#prevCanvas'),mid:$('#midCanvas'),next:$('#nextCanvas')},helpButtons=[...document.querySelectorAll('.help')];const currentNumber=()=>baseValue,roleValue=role=>baseValue+role-1;
function shade(hex,a){const n=parseInt(hex.slice(1),16),cl=v=>Math.max(0,Math.min(255,v));return`rgb(${cl((n>>16)+a)},${cl(((n>>8)&255)+a)},${cl((n&255)+a)})`}
function mixColor(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16),ch=(n,s)=>(n>>s)&255,h=n=>Math.round(n).toString(16).padStart(2,'0');return`#${h(ch(pa,16)*(1-t)+ch(pb,16)*t)}${h(ch(pa,8)*(1-t)+ch(pb,8)*t)}${h(ch(pa,0)*(1-t)+ch(pb,0)*t)}`}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function digits(n){return[n%10,Math.floor(n/10)%10,Math.floor(n/100)%10,Math.floor(n/1000)%10]}
function setupCanvas(canvas){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);const c=canvas.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,w:r.width,h:r.height}}
function materialLayoutCounts(w,h,ds){const pad=Math.max(8,w*.045),top=Math.max(62,h*.105),bottom=h-38,rowH=Math.max(35,(bottom-top)/4),items=[];for(let type=3;type>=0;type--){const count=ds[type];if(!count)continue;const layoutCount=type===0?10:count,b=BLOCKS[type],bw=b.nx+b.ny*.46,bh=b.nz+b.ny*.3,row=3-type,y0=top+row*rowH;let best={u:0,cols:1,rows:layoutCount};for(let cols=1;cols<=layoutCount;cols++){const rows=Math.ceil(layoutCount/cols),u=Math.min((w-pad*2)/(cols*bw+(cols-1)*.65),(rowH*.88)/(rows*bh+(rows-1)*.55));if(u>best.u)best={u,cols,rows}}const u=Math.max(1.7,best.u),gapX=u*.65,gapY=u*.55,totalW=best.cols*bw*u+(best.cols-1)*gapX,totalH=best.rows*bh*u+(best.rows-1)*gapY,startX=(w-totalW)/2,startY=y0+(rowH-totalH)/2;for(let k=0;k<count;k++){const col=k%best.cols,r=Math.floor(k/best.cols),ox=startX+col*(bw*u+gapX),base=startY+(r+1)*bh*u+r*gapY;items.push({type,ox,base,u})}}return items}
function materialLayout(w,h,n){return materialLayoutCounts(w,h,digits(n))}
function render(canvas,n,opts={}){const{c,w,h}=setupCanvas(canvas);c.clearRect(0,0,w,h);if(n==null)return;const items=materialLayout(w,h,n);items.forEach((it,i)=>drawBlock(c,BLOCKS[it.type],it.ox,it.base,it.u,1,opts.highlight===i));}
function renderCounts(canvas,counts,highlightType=-1){const{c,w,h}=setupCanvas(canvas);c.clearRect(0,0,w,h);materialLayoutCounts(w,h,counts).forEach(it=>drawBlock(c,BLOCKS[it.type],it.ox,it.base,it.u,1,it.type===highlightType))}
function renderAll(){if(busy)return;roles.forEach((name,role)=>{const shown=role===givenRole||$('#'+name+'Status').dataset.done;render(canvases[name],shown?roleValue(role):null)})}
function validate(input,target){const raw=input.value.replace(/\D/g,'');input.value=raw;input.classList.remove('wrong','correct');const role=fields.indexOf(input);if(!raw){if(role===1&&givenRole!==1){delete $('#midStatus').dataset.done;renderAll()}updateHelpButtons();return false}const ok=Number(raw)===target;input.classList.add(ok?'correct':'wrong');if(role===1&&givenRole!==1){if(ok)$('#midStatus').dataset.done='1';else delete $('#midStatus').dataset.done;renderAll()}updateHelpButtons();checkBoth();return ok}
fields.forEach((field,role)=>field.addEventListener('input',()=>{field.value=field.value.replace(/\D/g,'').slice(0,4);if(role===givenRole){if(!field.value)return;const entered=Number(field.value),candidate=entered-(role-1);baseValue=Math.max(1,Math.min(9998,candidate));field.value=roleValue(role);fields.forEach((f,i)=>{if(i!==givenRole){f.value='';f.classList.remove('wrong','correct')}});solvedShown=false;roles.forEach(name=>{const s=$('#'+name+'Status');s.textContent='';delete s.dataset.done});renderAll()}else validate(field,roleValue(role))}));
function checkBoth(){const ok=fields.every((field,role)=>role===givenRole||Number(field.value)===roleValue(role));if(ok&&!solvedShown){solvedShown=true;setTimeout(()=>{drawNumberline();$('#round').classList.add('show')},450)}}
function rectInWork(el){const a=el.getBoundingClientRect(),b=work.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height}}
function sizeFx(){const r=work.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);fx.width=Math.round(r.width*d);fx.height=Math.round(r.height*d);fx.style.width=r.width+'px';fx.style.height=r.height+'px';const c=fx.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,w:r.width,h:r.height}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function flyCopy(side,sourceName,sourceValue){const {c,w,h}=sizeFx(),from=rectInWork(canvases[sourceName]),to=rectInWork(canvases[side]),items=materialLayout(from.w,from.h,sourceValue),start=performance.now(),duration=2400;return new Promise(resolve=>{function frame(now){const t=Math.min(1,(now-start)/duration),e=1-Math.pow(1-t,3),dx=from.x+(to.x-from.x)*e,dy=from.y+(to.y-from.y)*e;c.clearRect(0,0,w,h);items.forEach(it=>drawBlock(c,BLOCKS[it.type],dx+it.ox,dy+it.base,it.u,.96));if(t<1)requestAnimationFrame(frame);else{c.clearRect(0,0,w,h);resolve()}}requestAnimationFrame(frame)})}
async function unbundleStep(canvas,counts,source,locks){
  const stepEl=$('#prevStep');stepEl.classList.remove('show');stepEl.innerHTML='';const before=[...counts],after=[...counts];after[source]--;after[source-1]+=10;
  const {c,w,h}=setupCanvas(canvas),standardBefore=materialLayoutCounts(w,h,before),beforeItems=locks.size?[...locks.values()].flat():standardBefore,chosen=beforeItems.filter(x=>x.type===source).at(-1),staticItems=beforeItems.filter(it=>it!==chosen),endChildren=materialLayoutCounts(w,h,after).filter(x=>x.type===source-1).slice(-10),large=BLOCKS[source],small=BLOCKS[source-1],u0=chosen?.u||Math.max(2,w/100),ox0=chosen?.ox||w/2,base0=chosen?.base||h/2;
  const childStart=k=>source===1?{ox:ox0+k*u0,base:base0,u:u0}:source===2?{ox:ox0,base:base0-k*u0,u:u0}:{ox:ox0+k*.46*u0,base:base0-k*.3*u0,u:u0};

async function markAndThrowOne(canvas,counts,locks){

  await new Promise(resolve=>{const start=performance.now(),duration=1450;function frame(now){const t=Math.min(1,(now-start)/duration),e=ease(t);c.clearRect(0,0,w,h);drawStatic();drawBlock(c,BLOCKS[0],one.ox+(w+80-one.ox)*e,one.base+(h*.42-one.base)*e,one.u*(1-.18*e),1,true);if(t<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});counts[0]--;c.clearRect(0,0,w,h);drawStatic();locks.clear();for(let type=0;type<4;type++)locks.set(type,staticItems.filter(x=>x.type===type));await wait(700)
}
async function makePredecessor(canvas,n){const counts=digits(n),locks=new Map;while(counts[0]===0){let source=1;while(source<4&&counts[source]===0)source++;if(source>3)break;await unbundleStep(canvas,counts,source,locks)}await markAndThrowOne(canvas,counts,locks)}
async function animateChange(side){if(busy)return;const targetRole=roles.indexOf(side),middleCorrect=Number(fields[1].value)===roleValue(1),sourceRole=Math.abs(targetRole-givenRole)===1?givenRole:(Math.abs(targetRole-givenRole)===2&&middleCorrect?1:-1);if(sourceRole<0||Math.abs(targetRole-sourceRole)!==1)return;busy=true;helpButtons.forEach(b=>b.disabled=true);const delta=targetRole-sourceRole,sourceName=roles[sourceRole],n=roleValue(sourceRole),canvas=canvases[side],stepEl=$('#'+side+'Step'),status=$('#'+side+'Status'),subtract=delta<0;status.textContent='';await flyCopy(side,sourceName,n);render(canvas,n);await wait(650);stepEl.innerHTML=subtract?`Einen&nbsp;<span class="yellow">Einer</span>&nbsp;müssen wir abziehen.`:`Einen&nbsp;<span class="yellow">Einer</span>&nbsp;müssen wir hinzufügen.`;stepEl.classList.add('show');await wait(2000);if(subtract)await makePredecessor(canvas,n);else{await addOne(canvas,n);await normalize(canvas,n);render(canvas,n+1)}status.textContent='';status.dataset.done='1';await wait(700);stepEl.classList.remove('show');busy=false;helpButtons.forEach(b=>b.disabled=false)}
async function addOne(canvas,n){const{c,w,h}=setupCanvas(canvas),items=materialLayout(w,h,n),rawCounts=digits(n);rawCounts[0]++;const target=materialLayoutCounts(w,h,rawCounts).filter(x=>x.type===0).at(-1)||{ox:w*.86,base:h*.28,u:Math.max(3,w/115)},start=performance.now();return new Promise(resolve=>{function f(now){const t=Math.min(1,(now-start)/900),e=1-Math.pow(1-t,3);c.clearRect(0,0,w,h);items.forEach(it=>drawBlock(c,BLOCKS[it.type],it.ox,it.base,it.u));const sx=w+30,sy=Math.max(90,h*.24);drawBlock(c,BLOCKS[0],sx+(target.ox-sx)*e,sy+(target.base-sy)*e,target.u,1,true);if(t<1)requestAnimationFrame(f);else resolve()}requestAnimationFrame(f)})}
async function bundleStep(canvas,counts,source,text){
  const targetName=Object.entries(canvases).find(([,value])=>value===canvas)?.[0]||'next',stepEl=$('#'+targetName+'Step'),before=[...counts],after=[...counts];after[source]-=10;after[source+1]++;
  const {c,w,h}=setupCanvas(canvas),allBefore=materialLayoutCounts(w,h,before),moving=allBefore.filter(x=>x.type===source).slice(-10),staticItems=materialLayoutCounts(w,h,before.map((v,i)=>i===source?v-10:v)),endItems=materialLayoutCounts(w,h,after),end=endItems.filter(x=>x.type===source+1).at(-1),oldTargets=staticItems.filter(x=>x.type===source+1),newTargets=endItems.filter(x=>x.type===source+1).slice(0,-1),tgt=BLOCKS[source+1],src=BLOCKS[source];
  const top=Math.max(62,h*.105),bottom=h-38,rowH=Math.max(35,(bottom-top)/4),sourceRow=3-source,centerY=top+sourceRow*rowH+rowH/2,targetU=end?end.u:Math.max(2,w/100),targetW=(tgt.nx+tgt.ny*.46)*targetU,targetH=(tgt.nz+tgt.ny*.3)*targetU,assemblyOx=(w-targetW)/2,assemblyBase=centerY+targetH/2;

async function normalize(canvas,n){const counts=digits(n);counts[0]++;renderCounts(canvas,counts,0);await wait(900);if(counts[0]>=10)await bundleStep(canvas,counts,0,`10 <span class="yellow">Einer</span> werden zu 1 <span style="color:#2e9e82">Zehner</span> gebündelt.`);if(counts[1]>=10)await bundleStep(canvas,counts,1,`10 <span style="color:#2e9e82">Zehner</span> werden zu 1 <span style="color:#5875ca">Hunderter</span> gebündelt.`);if(counts[2]>=10)await bundleStep(canvas,counts,2,`10 <span style="color:#5875ca">Hunderter</span> werden zu 1 <span style="color:#d94d70">Tausender</span> gebündelt.`)}

function drawNumberline(){const canvas=$('#numberline'),r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);const c=canvas.getContext('2d');c.setTransform(d,0,0,d,0,0);const n=currentNumber(),vals=[n-3,n-2,n-1,n,n+1,n+2,n+3],x0=30,x1=r.width-38,y=r.height*.49,step=(x1-x0)/6,colors=['#74847c','#74847c','#d34f56','#111111','#2d9b62','#74847c','#74847c'],roleLabels=['','','Vorgänger','Zahl','Nachfolger','',''];c.strokeStyle='#34473e';c.lineWidth=4;c.beginPath();c.moveTo(x0-10,y);c.lineTo(x1+14,y);c.stroke();c.beginPath();c.moveTo(x1+14,y);c.lineTo(x1+1,y-8);c.lineTo(x1+1,y+8);c.closePath();c.fillStyle='#34473e';c.fill();vals.forEach((v,i)=>{const x=x0+i*step;c.beginPath();c.moveTo(x,y-10);c.lineTo(x,y+10);c.stroke();c.fillStyle=colors[i];c.font=`${i===3?'italic ':''}900 ${Math.max(12,Math.min(19,r.width/34))}px Arial`;c.textAlign='center';c.textBaseline='bottom';c.fillText(v.toLocaleString('de-DE'),x,y-15);if(roleLabels[i]){c.font=`${i===3?'italic ':''}800 ${Math.max(9,Math.min(13,r.width/48))}px Arial`;c.textBaseline='top';c.fillText(roleLabels[i],x,y+17)}})}
function updateHelpButtons(){const middleCorrect=Number(fields[1].value)===roleValue(1);helpButtons.forEach(button=>{const role=roles.indexOf(button.dataset.side),distance=Math.abs(role-givenRole),show=role!==givenRole&&distance<=2&&(distance!==2||middleCorrect);button.hidden=!show;if(show){button.removeAttribute('hidden');button.style.display='inline-block'}else{button.setAttribute('hidden','');button.style.display='none'}})}
function prepareTask(){baseValue=TASKS[task];fields.forEach(field=>{field.value='';field.classList.remove('wrong','correct')});fields[givenRole].value=roleValue(givenRole);solvedShown=false;$('#round').classList.remove('show');roles.forEach(name=>{const status=$('#'+name+'Status'),step=$('#'+name+'Step');status.textContent='';delete status.dataset.done;step.classList.remove('show');step.innerHTML=''});updateHelpButtons();renderAll();fields.find((_,role)=>role!==givenRole)?.focus()}
function newTask(){completed++;task=(task+1)%TASKS.length;if(completed<2)givenRole=1;else if(completed===2)givenRole=Math.random()<.5?0:2;else{const choices=[0,1,2].filter(role=>role!==givenRole);givenRole=choices[Math.floor(Math.random()*choices.length)]}prepareTask()}
