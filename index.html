  <title>Schulportal</title>
  <style>
    :root {
      --bg: #edf6f8;
      --panel: #ffffff;
      --panel-2: #eef8fb;
      --line: #cfe1e8;
      --line-strong: #9bb6c3;
      --text: #16202b;
      --muted: #5d7081;
      --accent: #087995;
      --accent-soft: #dcf3f8;
      --blue: #116fc2;
      --blue-soft: #e4f0ff;
      --green: #2f7d5b;
      --green-soft: #dcf5e7;
      --mint-soft: #e4f8f0;
      --pastel-header: #e5f6eb;
      --pastel-header-line: #c8e8d2;
      --violet-soft: #f0e9ff;
      --warm-soft: #fff7e6;
      --gold: #bf8300;
      --gold-soft: #fff4d8;
      --danger: #c9182b;
      --good: #2f7d48;
      --shadow: 0 18px 36px rgba(20, 35, 50, .16);
      --shadow-soft: 0 8px 22px rgba(20, 35, 50, .08);
      --workspace-header-height: 86px;
    }

    * {
      box-sizing: border-box;
    }

    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    ::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 12%, rgba(87, 190, 218, .22), transparent 34%),
        radial-gradient(circle at 88% 4%, rgba(255, 194, 72, .2), transparent 30%),
        linear-gradient(135deg, #e9f7fb 0%, #f6fbf7 48%, #fff6e4 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      min-height: 34px;
      padding: 6px 10px;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }

    button:hover {
      border-color: var(--accent);
      background: #f1fbfe;
      box-shadow: var(--shadow-soft);
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(11, 113, 137, .22);
    }

    button.warning {
      border-color: var(--gold);
      background: var(--gold-soft);
      color: #3c2a00;
    }

    button.danger {
      border-color: #e0a9b1;
      background: #fff0f2;
      color: var(--danger);
    }

    button.delete-round,
    .top-icon-button.delete-round {
      position: relative;
      width: 46px;
      min-width: 46px;
      height: 46px;
      min-height: 46px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      border: 2px solid #ff7373;
      background:
        linear-gradient(155deg, rgba(255, 255, 255, .28) 0 29%, transparent 30%),
        radial-gradient(circle at 38% 28%, #ff4545 0%, #e10000 46%, #a80000 100%);
      box-shadow:
        inset 0 2px 8px rgba(255, 255, 255, .3),
        inset 0 -8px 14px rgba(92, 0, 0, .3),
        0 8px 18px rgba(178, 0, 0, .24);
    }

    button.delete-round:hover,
    .top-icon-button.delete-round:hover {
      border-color: #ff9b9b;
      background:
        linear-gradient(155deg, rgba(255, 255, 255, .34) 0 29%, transparent 30%),
        radial-gradient(circle at 38% 28%, #ff5b5b 0%, #e50000 46%, #a60000 100%);
      box-shadow:
        inset 0 2px 8px rgba(255, 255, 255, .32),
        inset 0 -8px 14px rgba(92, 0, 0, .3),
        0 10px 22px rgba(178, 0, 0, .3);
    }

    button.delete-round svg,
    .top-icon-button.delete-round svg {
      width: 27px;
      height: 27px;
      pointer-events: none;
      stroke: currentColor;
      filter: drop-shadow(0 1px 1px rgba(86, 0, 0, .28));
    }

    button.icon {
      width: 34px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-weight: 700;
    }

    button.trash-icon {
      width: 46px;
      min-width: 46px;
      height: 46px;
      min-height: 46px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    button.round-image-button {
      width: 56px;
      min-width: 56px;
      height: 56px;
      min-height: 56px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }

    button.round-image-button:hover {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      transform: translateY(-1px) scale(1.03);
    }

    button.round-image-button .button-art {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 50%;
      pointer-events: none;
    }

    button.panel-add-button {
      width: 48px;
      min-width: 48px;
      height: 48px;
      min-height: 48px;
    }

    button.trash-icon:not(.delete-round) svg {
      width: 21px;
      height: 21px;
      pointer-events: none;
      stroke: currentColor;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      padding: 8px 9px;
      min-height: 36px;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 0;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(11, 113, 137, .14);
    }

    textarea {
      resize: vertical;
      min-height: 84px;
      line-height: 1.35;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      min-height: 620px;
      display: grid;
      grid-template-rows: 62px 1fr;
      overflow: hidden;
      background: rgba(255, 255, 255, .72);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      background: linear-gradient(90deg, rgba(255, 255, 255, .94), rgba(239, 250, 253, .9));
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      min-width: 0;
      box-shadow: 0 8px 22px rgba(20, 35, 50, .06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 330px;
    }

    .daily-overview-trigger {
      width: 30px;
      min-width: 30px;
      height: 30px;
      min-height: 30px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      box-shadow: none;
      opacity: .72;
    }

    .daily-overview-trigger:hover {
      background: rgba(255, 255, 255, .7);
      box-shadow: none;
      opacity: 1;
    }

    .daily-overview-trigger img {
      width: 28px;
      height: 28px;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    .brand-home {
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      padding: 0;
      min-height: 0;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    .brand-home:hover {
      background: transparent;
      transform: none;
    }

    .brand-home:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .brand-logo-full {
      height: 54px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      display: block;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .calendar-icon-button {
      position: relative;
      width: 30px;
      min-width: 30px;
      height: 30px;
      min-height: 30px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      opacity: .72;
    }

    .calendar-icon-button:hover {
      opacity: 1;
      transform: none;
      background: transparent;
    }

    .notes-icon-button {
      width: 30px;
      min-width: 30px;
      height: 30px;
      min-height: 30px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      opacity: .72;
    }

    .notes-icon-button:hover {
      background: transparent;
      box-shadow: none;
      opacity: 1;
      transform: none;
    }

    .notes-icon-image {
      width: 28px;
      height: 28px;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    .calendar-icon-image {
      width: 28px;
      height: 28px;
      display: block;
      object-fit: contain;
    }

    .calendar-badge {
      position: absolute;
      top: -7px;
      right: -7px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: #d31335;
      color: #fff;
      border: 2px solid #fff;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 4px 10px rgba(211, 19, 53, .28);
    }

    .course-heading {
      flex: 1;
      text-align: center;
      min-width: 0;
    }

    .course-heading h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .course-heading p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .course-heading p:empty {
      display: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      min-width: 198px;
    }

    .top-icon-button {
      width: 56px;
      min-width: 56px;
      height: 56px;
      min-height: 56px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      overflow: visible;
    }

    .top-icon-button svg {
      width: 22px;
      height: 22px;
      pointer-events: none;
      stroke: currentColor;
    }

    .top-icon-button .button-art {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 50%;
      pointer-events: none;
    }

    .top-icon-button.image-button {
      background: transparent;
      box-shadow: none;
    }

    .top-icon-button.image-button:hover {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      transform: translateY(-1px) scale(1.03);
    }

    .top-icon-button.upload-button {
      width: 46px;
      min-width: 46px;
      height: 46px;
      min-height: 46px;
      border-radius: 50%;
      color: #fff;
      border: 2px solid #65bff0;
      background:
        linear-gradient(155deg, rgba(255, 255, 255, .28) 0 28%, transparent 29%),
        radial-gradient(circle at 36% 28%, #1eb5ff 0%, #057bd0 42%, #005096 100%);
      box-shadow:
        inset 0 2px 8px rgba(255, 255, 255, .28),
        inset 0 -7px 12px rgba(0, 52, 114, .28),
        0 8px 18px rgba(0, 92, 166, .26);
    }

    .top-icon-button.upload-button:hover {
      border-color: #8bd2ff;
      background:
        linear-gradient(155deg, rgba(255, 255, 255, .34) 0 28%, transparent 29%),
        radial-gradient(circle at 36% 28%, #35c0ff 0%, #087fd3 42%, #004f95 100%);
      box-shadow:
        inset 0 2px 8px rgba(255, 255, 255, .3),
        inset 0 -7px 12px rgba(0, 52, 114, .28),
        0 10px 22px rgba(0, 92, 166, .32);
    }

    .top-icon-button.upload-button svg {
      width: 27px;
      height: 27px;
      stroke-width: 2.5;
      filter: drop-shadow(0 1px 1px rgba(0, 35, 80, .25));
    }

    .top-icon-button.download-button {
      width: 46px;
      min-width: 46px;
      height: 46px;
      min-height: 46px;
      border-radius: 50%;
      color: #fff;
      border: 2px solid #c577ff;
      background:
        linear-gradient(155deg, rgba(255, 255, 255, .3) 0 28%, transparent 29%),
        radial-gradient(circle at 38% 28%, #bd55ff 0%, #8022cc 48%, #4b0f94 100%);
      box-shadow:
        inset 0 2px 8px rgba(255, 255, 255, .3),
        inset 0 -7px 12px rgba(45, 0, 96, .32),
        0 8px 18px rgba(91, 20, 154, .26);
    }

    .top-icon-button.download-button:hover {
      border-color: #d69aff;
      background:
        linear-gradient(155deg, rgba(255, 255, 255, .36) 0 28%, transparent 29%),
        radial-gradient(circle at 38% 28%, #c96cff 0%, #8828d3 48%, #4d1095 100%);
      box-shadow:
        inset 0 2px 8px rgba(255, 255, 255, .32),
        inset 0 -7px 12px rgba(45, 0, 96, .32),
        0 10px 22px rgba(91, 20, 154, .32);
    }

    .top-icon-button.download-button svg {
      width: 27px;
      height: 27px;
      stroke-width: 2.5;
      filter: drop-shadow(0 1px 1px rgba(35, 0, 76, .28));
    }

    .top-icon-button.danger:not(.delete-round) {
      color: var(--danger);
      background: #fff7f8;
      border-color: rgba(211, 19, 53, .26);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: var(--courses-width, 300px) var(--students-width, 280px) minmax(520px, 1fr);
      overflow: hidden;
    }

    .workspace.courses-collapsed {
      --courses-width: 58px;
    }

    .workspace.students-collapsed {
      --students-width: 58px;
    }

    .workspace.home-view {
      grid-template-columns: minmax(320px, 430px);
      background: linear-gradient(135deg, rgba(238, 251, 242, .8), rgba(255, 255, 255, .86));
    }

    .workspace.home-view.courses-collapsed {
      grid-template-columns: 58px;
    }

    .workspace.home-view #studentsPanel,
    .workspace.home-view .main {
      display: none;
    }

    .workspace.home-view #coursesPanel {
      border-right: 1px solid var(--line);
    }

    .panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(#ffffff, #f2fbfd);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: var(--workspace-header-height);
      min-height: var(--workspace-header-height);
      padding: 0 16px;
      border-bottom: 1px solid var(--pastel-header-line);
      background: var(--pastel-header);
      box-shadow: none;
      cursor: pointer;
    }

    .panel-header h2,
    .section-title {
      margin: 0;
      font-size: 18px;
      font-weight: 750;
    }

    .panel-title-button {
      border: 0;
      background: transparent;
      padding: 0;
      min-height: 0;
      font-size: 19px;
      font-weight: 820;
      text-align: left;
    }

    .panel-title-button:hover {
      background: transparent;
    }

    .panel-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      cursor: default;
    }

    .panel.collapsed .panel-body,
    .panel.collapsed .panel-actions,
    .panel.collapsed #studentCount {
      display: none;
    }

    .panel.collapsed .panel-header {
      justify-content: center;
      height: var(--workspace-header-height);
      min-height: var(--workspace-header-height);
      padding: 0 6px;
    }

    .panel.collapsed .panel-title-button {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 15px;
    }

    .panel-body {
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      padding: 12px 14px 16px;
      background: linear-gradient(#fbfeff, #f5fbf8);
    }

    /* Keep the final student above iPadOS' bottom bar and outside the
       rubber-band-only part of the scroll area. */
    #studentsPanel .panel-body {
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      scroll-padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .inline-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;

      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }

      border: 1px solid var(--line);
      border-radius: 10px;
      text-align: left;
      padding: 12px 10px 12px 14px;
      background: #fff;
      min-height: 54px;
      cursor: pointer;
      touch-action: pan-y;
      user-select: none;
      box-shadow: 0 8px 18px rgba(20, 35, 50, .05);
    }

    .course-item .item-menu-button {
      touch-action: manipulation;
    }

    .course-item.dragging {
      opacity: .78;

      cursor: grabbing;
      user-select: none;
      box-shadow: 0 16px 34px rgba(20, 35, 50, .18);

    .course-item.drop-target {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .course-item.drop-after {
      outline-color: var(--gold);

    .course-title {
      font-size: 18px;

    .course-meta,

        const className = normalizeText(input.value);
        const subject = normalizeText($("#courseSubjectSelect").value);
        if (!className) return;
        addCourse(className, subject);
        closeNewCourseModal();
        input.value = "";
        $("#courseSubjectSelect").value = "Mathematik";
      });

      $("#studentForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const firstName = normalizeText($("#studentFirstNameInput").value);
        const lastName = normalizeText($("#studentLastNameInput").value);
        const course = currentCourse();
        if (!firstName && !lastName) return;
        course.students.push(makeStudent(`${firstName} ${lastName}`));
        if (!view.selectedStudentId && course.students.length) view.selectedStudentId = course.students[0].id;
        save();
        render();
        closeNewStudentModal();
      });

      $("#studentEditForm").addEventListener("submit", (event) => {
        event.preventDefault();
        saveStudentEdit();
      });

      $("#gradeSetupForm").addEventListener("submit", (event) => {
        event.preventDefault();
        startGradeWizard();
      });

      $("#gradeInfoForm").addEventListener("submit", (event) => {
        event.preventDefault();
        saveGradeInfo();
      });

      $("#checklistForm").addEventListener("submit", (event) => {
        event.preventDefault();
        addChecklistFromModal();
      });

      $("#studentSearch").addEventListener("input", (event) => {
        view.search = event.target.value;
        renderStudents(currentCourse());
      });

      $("#studentSortSelect").addEventListener("change", (event) => {
        view.studentSortMode = event.target.value || "last";
      });

      $("#sortStudentsBtn").addEventListener("click", () => {
        const course = currentCourse();
        course.students.sort((a, b) => {
          const primaryA = view.studentSortMode === "first" ? a.firstName || a.name : a.lastName || a.name;
          const primaryB = view.studentSortMode === "first" ? b.firstName || b.name : b.lastName || b.name;
          return primaryA.localeCompare(primaryB, "de") || a.name.localeCompare(b.name, "de");
        });
        save();
        render();
      });

      $("#importStudentsBtn").addEventListener("click", () => $("#studentImportFile").click());

      $("#studentImportFile").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          await importStudentsFromFile(file);
        } catch (error) {
          alert(error.message || "Die Schülerliste konnte nicht importiert werden.");
        } finally {
          event.target.value = "";
        }
      });

      $("#studentPhotoInput").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        const studentId = event.target.dataset.studentId;
        if (!file || !studentId) return;
        try {
          const dataUrl = await readFileAsDataUrl(file);
          const photo = await compressStudentPhoto(dataUrl);
          setStudentPhoto(currentCourse(), studentId, photo);
        } catch (error) {
          alert(error.message || "Das Bild konnte nicht gespeichert werden.");
        } finally {
          event.target.value = "";
        }
      });

      $("#exportBtn").addEventListener("click", configureAutomaticBackup);

      $("#importBtn").addEventListener("click", () => $("#importFile").click());

      $("#clearDataBtn").addEventListener("click", () => {
        if (!confirm("Wirklich alle Kurse, Schüler, Noten und Einträge löschen?")) return;
        if (!confirm("Bitte bestätigen: Diese Aktion kann nur rückgängig gemacht werden, wenn du vorher eine Sicherung gespeichert hast.")) return;
        state = createDefaultData();
        view.homeOnly = true;
        view.tab = "coursebook";
        view.selectedStudentId = null;
        view.editingEntryId = null;
        view.selectedChecklistId = null;
        view.selectedChecklistCourseId = null;
        save();
        showCourseListOnly();
      });

      $("#importFile").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const imported = normalizeData(JSON.parse(text));
          if (confirm("Aktuelle Daten durch diese Sicherung ersetzen?")) {
            state = imported;
            view.selectedStudentId = currentCourse().students[0]?.id || null;
            save();
            render();
          }
        } catch {
          alert("Diese Datei konnte nicht geladen werden.");
        } finally {
          event.target.value = "";
        }
      });

      $("#mainContent").addEventListener("submit", (event) => {
        if (event.target.id === "trackingForm") {
          event.preventDefault();
          const course = currentCourse();
          const values = trackingValuesFromForm(event.target, view.editingEntryId || uid("e"));
          saveTrackingValues(course, values);
          view.editingEntryId = values.id;
          save();
          render();
          if (!$("#trackingDetailsModal").classList.contains("hidden")) renderTrackingDetailsModal();
        }
      });

      $("#oralModalContent").addEventListener("submit", (event) => {
        if (event.target.id === "oralEntryForm") {
          event.preventDefault();
          const course = currentCourse();
          const student = currentStudent(course);
          const data = new FormData(event.target);
          if (student && recordOralGrade(course, student.id, data.get("value"), data.get("date") || todayIso())) {
            closeOralModal();
            render();
          }
        }

        if (event.target.id === "oralEditForm") {
          event.preventDefault();
          const course = currentCourse();
          const entriesById = new Map((course.oralEntries || []).map((entry) => [entry.id, entry]));
          $$(".oral-list-row[data-oral-edit-row]", event.target).forEach((row) => {
            const entry = entriesById.get(row.dataset.oralEditRow);
            if (!entry) return;
            const date = row.querySelector(".oral-edit-date")?.value || todayIso();
            const value = row.querySelector(".oral-edit-value")?.value || "";
            if (!Number.isNaN(parseGradeForCourse(course, value))) {
              entry.date = date;
              entry.value = value;
              entry.periodKey = epoPeriodFromDate(date);
            }
          });
          syncOralGradeColumns(course);
          save();
          closeOralModal();
          render();
        }
      });

      $("#mainContent").addEventListener("input", (event) => {
        if (event.target.classList.contains("grade-input")) {
          const course = currentCourse();
          const column = course.gradeColumns.find((item) => item.id === event.target.dataset.colId);
          if (!column) return;
          if (column.autoEpo || column.autoOral) return;
          column.grades[event.target.dataset.studentId] = event.target.value.trim();
          event.target.classList.toggle("invalid", isInvalidGrade(event.target.value, course));
          save();
        }

        if (event.target.id === "studentNotesEdit") {
          const student = currentStudent();
          if (!student) return;
          student.notes = event.target.value;
          save();
        }

        if (event.target.id === "coursebookNotes") {
          const book = currentGroupBook();
          book.notes = event.target.value;
          save();
        }
      });

      $("#mainContent").addEventListener("change", (event) => {
        if (event.target.classList.contains("grade-input")) render();

        if (event.target.id === "seatingPlanSelect") {
          const course = currentCourse();
          course.activeSeatingPlanId = event.target.value;
          currentSeatingPlan(course);
          save();
          renderSeating(course);
          return;
        }

        if (event.target.id === "seatTileScaleSelect") {
          const course = currentCourse();
          currentSeatingPlan(course).tileScale = Number(event.target.value) || 1;
          save();
          renderSeating(course);
          return;
        }

        if (event.target.id === "seatGridSizeSelect") {
          const course = currentCourse();
          const plan = currentSeatingPlan(course);
          plan.gridSize = Number(event.target.value) || 24;
          Object.values(plan.positions).forEach((position) => {
            position.x = snapSeatValue(position.x, plan);
            position.y = snapSeatValue(position.y, plan);
          });
          plan.tables.forEach((table) => {
            table.x = snapSeatValue(table.x, plan);
            table.y = snapSeatValue(table.y, plan);
          });
          save();
          renderSeating(course);
          return;
        }

        if (event.target.id === "openOnlyToggle") {
          const list = currentChecklist();
          if (!list) return;
          list.showOpenOnly = event.target.checked;
          save();
          renderChecklists(currentCourse());
        }

        if (event.target.matches("[data-check-student]")) {
          const list = currentChecklist();
          if (!list) return;
          const studentId = event.target.dataset.checkStudent;
          if (event.target.checked && !list.done.includes(studentId)) list.done.push(studentId);
          if (!event.target.checked) list.done = list.done.filter((id) => id !== studentId);
          save();
          renderChecklists(currentCourse());
        }
      });

      $("#mainContent").addEventListener("dblclick", (event) => {
        const input = event.target.closest(".grade-input");
        if (!input) return;
        input.focus();
        input.select();
      });

      $("#mainContent").addEventListener("click", (event) => {
        if (event.target.id === "toggleGradePrivacyBtn") {
          view.gradePrivacy = !view.gradePrivacy;
          view.gradePrivacyStudentId = null;
          keepScrollWhile(() => renderGrades(currentCourse()));
          return;
        }

        const privacyRow = event.target.closest("[data-grade-privacy-student]");
        if (privacyRow && view.tab === "grades" && view.gradePrivacy) {
          const studentId = privacyRow.dataset.gradePrivacyStudent;
          view.gradePrivacyStudentId = view.gradePrivacyStudentId === studentId ? null : studentId;
          keepScrollWhile(() => renderGrades(currentCourse()));
          return;
        }

        const studentOverviewButton = event.target.closest("[data-open-student-overview]");
        if (studentOverviewButton) {
          openStudentOverview(studentOverviewButton.dataset.openStudentOverview);
          return;
        }

        const seatTile = event.target.closest("[data-seat-student]");
        if (seatTile) {
          if (Date.now() < view.seatingSuppressClickUntil) return;
          handleSeatingStudentTap(seatTile.dataset.seatStudent);
          return;
        }

        const seatingModeButton = event.target.closest("[data-seating-mode]");
        if (seatingModeButton) {
          const mode = seatingModeButton.dataset.seatingMode;
          view.seatingMode = view.seatingMode === mode ? null : mode;
          renderSeating(currentCourse());
          return;
        }

        if (event.target.id === "newSeatingPlanBtn") {
          const course = currentCourse();
          const currentPlan = currentSeatingPlan(course);
          const name = `Sitzplan ${course.seatingPlans.length + 1}`;
          const plan = {
            id: uid("sp"),
            name,
            positions: Object.fromEntries(Object.entries(currentPlan.positions).map(([id, position]) => [id, { ...position }])),
            tables: currentPlan.tables.map((table) => ({ ...table, id: uid("table") })),
            tileScale: currentPlan.tileScale,
            gridSize: currentPlan.gridSize
          };
          course.seatingPlans.push(plan);
          course.activeSeatingPlanId = plan.id;
          course.seatPositions = plan.positions;
          save();
          renderSeating(course);
          return;
        }

        if (event.target.id === "renameSeatingPlanBtn") {
          const course = currentCourse();
          const plan = currentSeatingPlan(course);
          const name = normalizeText(prompt("Neuer Name des Sitzplans:", plan.name));
          if (!name) return;
          plan.name = name;
          save();
          renderSeating(course);
          return;
        }

        if (event.target.id === "deleteSeatingPlanBtn") {
          const course = currentCourse();
          const plan = currentSeatingPlan(course);
          if (course.seatingPlans.length <= 1 || !confirm(`Sitzplan „${plan.name}“ löschen?`)) return;
          course.seatingPlans = course.seatingPlans.filter((item) => item.id !== plan.id);
          course.activeSeatingPlanId = course.seatingPlans[0].id;
          currentSeatingPlan(course);
          save();
          renderSeating(course);
          return;
        }

        if (event.target.id === "addSeatTableBtn") {
          const course = currentCourse();
          const plan = currentSeatingPlan(course);
          plan.tables.push({ id: uid("table"), label: `Tisch ${plan.tables.length + 1}`, x: snapSeatValue(48 + plan.tables.length * 24, plan), y: snapSeatValue(48 + plan.tables.length * 24, plan), width: 220, height: 72 });
          save();
          renderSeating(course);
          return;
        }

        if (event.target.id === "removeSeatTableBtn") {
          const course = currentCourse();
          const plan = currentSeatingPlan(course);
          if (!plan.tables.length || !confirm("Den zuletzt hinzugefügten Tisch löschen?")) return;
          plan.tables.pop();
          save();
          renderSeating(course);
          return;
        }

        if (event.target.id === "shuffleSeatingBtn") {
          const course = currentCourse();
          const shuffledIds = shuffle(course.students.map((student) => student.id));
          course.seatOrder = shuffledIds;
          arrangeSeatPositions(course, shuffledIds.map((id) => course.students.find((student) => student.id === id)).filter(Boolean));
          save();
          renderSeating(course);
          return;
        }

        if (event.target.id === "openGradeModalBtn") openGradeModal();

        if (event.target.id === "deleteAllGradesBtn") {
          const course = currentCourse();
          const hasAnythingToDelete = course.gradeColumns.length || (course.epoEntries || []).length || (course.oralEntries || []).length;
          if (hasAnythingToDelete && confirm("Wirklich alle Leistungen dieses Kurses löschen? Auch EPO und mündliche Noten werden gelöscht.")) {
            course.gradeColumns = [];
            course.epoEntries = [];
            course.oralEntries = [];
            save();
            render();
          }
        }

        if (event.target.id === "newChecklistBtn") openNewChecklistModal();

        if (event.target.id === "addRemarkBtn") addStudentRemark(currentCourse(), view.selectedStudentId);

        if (event.target.id === "addOralGradeBtn") {
          openOralAddModal();
          return;
        }

        const epoDetailsButton = event.target.closest("[data-open-epo-details]");
        if (epoDetailsButton) {
          openEpoDetailsModal();
          return;
        }

        const epoButton = event.target.closest("[data-epo-value]");
        if (epoButton) {
          recordEpoThumb(currentCourse(), view.selectedStudentId, epoButton.dataset.epoCategory, epoButton.dataset.epoValue);
          keepScrollWhile(render);
          return;
        }

        if (event.target.closest("[data-undo-epo-thumb]")) {
          undoLastEpoThumb(currentCourse(), view.selectedStudentId);
          keepScrollWhile(render);
          return;
        }

        const expandCategory = event.target.closest("[data-expand-grade-category]");
        if (expandCategory) {
          const category = expandCategory.dataset.expandGradeCategory;
          view.expandedGradeCategory = view.expandedGradeCategory === category ? null : category;
          renderNotes(currentCourse());
          return;
        }

        if (event.target.id === "csvBtn") exportCsv(currentCourse());

        if (event.target.id === "openTrackingDetailsBtn") {
          openTrackingDetailsModal();
          return;
        }

        if (event.target.id === "newEntryBtn") {
          view.editingEntryId = null;
          renderTracking(currentCourse());
        }

        if (event.target.id === "deleteEntryBtn") {
          const course = currentCourse();
          const entry = course.checkEntries.find((item) => item.id === view.editingEntryId);
          if (entry && confirm("Diesen Eintrag löschen?")) {
            course.checkEntries = course.checkEntries.filter((item) => item.id !== entry.id);
            view.editingEntryId = null;
            save();
            render();
          }
        }

        if (event.target.id === "deleteChecklistBtn") {
          const info = currentChecklistInfo(currentCourse());
          const course = info?.course;
          const list = info?.list;
          if (list && confirm(`Checkliste "${list.title}" löschen?`)) {
            course.checklists = course.checklists.filter((item) => item.id !== list.id);
            view.selectedChecklistId = null;
            view.selectedChecklistCourseId = null;
            save();
            render();
          }
        }

      });

      const mainTabs = $("#mainTabs");
      mainTabs.addEventListener("scroll", updateTabScrollHints, { passive: true });
      $("#tabsScrollLeft").addEventListener("click", () => {
        mainTabs.scrollBy({ left: -Math.max(180, mainTabs.clientWidth * .72), behavior: "smooth" });
      });
      $("#tabsScrollRight").addEventListener("click", () => {
        mainTabs.scrollBy({ left: Math.max(180, mainTabs.clientWidth * .72), behavior: "smooth" });
      });
      window.addEventListener("resize", updateTabScrollHints, { passive: true });

      setupLockScreen();
      render();
      updateTabScrollHints();
      updateBackupButtonStatus();
      runAutomaticScheduledBackup();
      setInterval(runAutomaticScheduledBackup, 10 * 60 * 1000);
      setInterval(renderCalendarBadge, 60000);
    })();
  </script>
</body>
</html>
